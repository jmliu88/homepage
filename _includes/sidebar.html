<aside class="sidebar">
  <div class="sidebar-inner">
    <a class="avatar" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/photo.jpg' | relative_url }}" alt="{{ site.author.name }}"
           onerror="this.onerror=null;this.src='{{ '/assets/img/avatar-placeholder.svg' | relative_url }}';">
    </a>
    <h1 class="name">{{ site.author.name }}</h1>
    <p class="name-zh">{{ site.author.name_zh }}</p>
    <p class="role">{{ site.author.role }}</p>
    <p class="affiliation">{{ site.author.affiliation }}</p>
    <p class="location">{{ site.author.location }}</p>

    <ul class="contact-list">

        <a href="mailto:{{ site.author.email }}">

      <li>

    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>About</a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.url contains 'publications' %}class="active"{% endif %}>Publications</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains 'projects' %}class="active"{% endif %}>Projects</a>
    </nav>
  </div>
</aside>
